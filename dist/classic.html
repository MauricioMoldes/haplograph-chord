<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HaploGraph cross-chromosome map</title>
<!--
  HaploGraph cross-chromosome chord diagram (self-contained; embed with an <iframe>).
  Data: https://haplograph.haploblocks.org/data/chrpair_by_band.tsv  (hard-coded in CFG.data; from aggregate_edges.sh; columns chrom_a chrom_b lift_band n_edges mean_weight)
  Options (query string): ?theme=dark  ?data=path/to/chrpair_by_band.tsv  ?bands=2-3,3-5  ?scale=sqrt
  Config below. Exports (SVG/PNG) are always rendered on white for papers and reports.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root { --bg:#ffffff; --ink:#1f2a37; --muted:#6b7280; --line:#e6eaf0; --soft:#f4f7fb; --accent:#2563a6; }
  :root[data-theme="dark"] { --bg:#0b0f14; --ink:#e5e9f0; --muted:#9aa5b4; --line:#1e2733; --soft:#111823; --accent:#7fb2e5; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1100px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; font-weight:600; margin:0 0 2px; }
  .sub { color:var(--muted); margin:0 0 12px; }
  .controls { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding:10px 12px; background:var(--soft); border-radius:10px; margin-bottom:12px; }
  .controls .grp { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .controls .lbl { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.04em; margin-right:2px; }
  label.chip { display:inline-flex; gap:5px; align-items:center; padding:3px 9px; border:1px solid var(--line); border-radius:999px; cursor:pointer; background:var(--bg); user-select:none; }
  label.chip input { accent-color:var(--accent); margin:0; }
  select, button { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:4px 10px; cursor:pointer; }
  button:hover, select:hover { border-color:var(--accent); }
  .main { display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:16px; align-items:start; }
  @media (max-width: 820px) { .main { grid-template-columns:1fr; } }
  #chart { position:relative; }
  svg { width:100%; height:auto; display:block; }
  #tip { position:absolute; pointer-events:none; background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; box-shadow:0 4px 14px rgba(0,0,0,.12); font-size:12.5px; display:none; max-width:260px; z-index:5; }
  #tip b { font-weight:600; }
  .panel { background:var(--soft); border-radius:10px; padding:12px; font-size:13px; }
  .panel h2 { font-size:13px; margin:0 0 6px; font-weight:600; }
  .panel table { width:100%; border-collapse:collapse; margin-bottom:10px; }
  .panel td { padding:2px 0; } .panel td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); }
  #msg { padding:14px; border:1px dashed var(--line); border-radius:10px; display:none; margin-bottom:12px; }
  .foot { color:var(--muted); font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Cross-chromosome HaploGraph</h1>
  <p class="sub" id="sub"></p>

  <div id="msg"></div>

  <div class="controls">
    <div class="grp"><span class="lbl">Lift</span><span id="bands"></span></div>
    <div class="grp"><label class="chip"><input type="checkbox" id="same" checked> same chromosome</label></div>
    <div class="grp"><span class="lbl">Width</span>
      <select id="scale"><option value="linear">linear</option><option value="sqrt">square root</option></select></div>
    <div class="grp" style="margin-left:auto">
      <button id="reset">Reset</button>
      <button id="dlsvg">SVG</button><button id="dlpng">PNG</button><button id="dlcsv">CSV</button>
    </div>
  </div>

  <div class="main">
    <div id="chart"><div id="tip"></div><svg id="svg" viewBox="0 0 820 860" role="img" aria-label="Chord diagram of HaploGraph edges between chromosomes"></svg></div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="foot">Each ribbon joins two chromosomes; its width is the number of edges (pairs of haplotype-cluster nodes sharing individuals) that pass the filters. Click a chromosome to focus; click again to release.</div>
</div>

<script>
/* ---------- configuration ---------- */
const CFG = Object.assign({
  title: "Cross-chromosome HaploGraph",
  cohort: "1000 Genomes, N = 2,548 individuals",
  threshold: "lift ≥ 2, weight ≥ 5; clusters with min(support, N − support) ≥ 25",
  data: "https://haplograph.haploblocks.org/data/chrpair_by_band.tsv",
  note: ""                                  // e.g. "DEMO DATA" shown on the figure
}, window.HAPLOGRAPH_CONFIG || {});
const Q = new URLSearchParams(location.search);
if (Q.get("theme") === "dark") document.documentElement.setAttribute("data-theme", "dark");
if (Q.get("data")) CFG.data = Q.get("data");
if (Q.get("note")) CFG.note = Q.get("note");

const LIGHT = { bg:"#ffffff", ink:"#1f2a37", muted:"#6b7280" };
const DARK  = { bg:"#0b0f14", ink:"#e5e9f0", muted:"#9aa5b4" };
const CHRS = d3.range(1, 23).map(i => "chr" + i);
const COL = i => d3.hcl((i * 360 / 22 + 20) % 360, 42, 66).formatHex();
const fmt = d3.format(",");
const compact = n => n >= 1e9 ? (n / 1e9).toFixed(2) + " billion" : n >= 1e6 ? (n / 1e6).toFixed(2) + " M" : fmt(n);

/* ---------- state ---------- */
let rows = [], bandNames = [], active = new Set(), focus = null;
let showSame = true, scaleMode = Q.get("scale") === "sqrt" ? "sqrt" : "linear";
document.getElementById("scale").value = scaleMode;

const bandLo = b => b.startsWith(">=") ? +b.slice(2) : +b.split("-")[0];

function load(text) {
  const parsed = d3.tsvParse(text.replace(/\r/g, ""));
  rows = parsed.map(d => ({ a: d.chrom_a, b: d.chrom_b, band: d.lift_band, n: +d.n_edges, w: +d.mean_weight }))
               .filter(d => CHRS.includes(d.a) && CHRS.includes(d.b) && d.n > 0);
  if (!rows.length) throw new Error("no usable rows (expected columns chrom_a chrom_b lift_band n_edges mean_weight)");
  bandNames = Array.from(new Set(rows.map(d => d.band))).sort((x, y) => bandLo(x) - bandLo(y));
  const want = Q.get("bands") ? new Set(Q.get("bands").split(",")) : null;
  active = new Set(want ? bandNames.filter(b => want.has(b)) : bandNames);
  buildControls(); draw();
}

function buildControls() {
  const host = d3.select("#bands").html("");
  bandNames.forEach(b => {
    const l = host.append("label").attr("class", "chip");
    l.append("input").attr("type", "checkbox").property("checked", active.has(b)).on("change", e => {
      e.target.checked ? active.add(b) : active.delete(b); draw();
    });
    l.append("span").text(b.startsWith(">=") ? "≥ " + b.slice(2) : b.replace("-", "–"));
  });
}

/* ---------- data -> matrix ---------- */
function matrix() {
  const idx = Object.fromEntries(CHRS.map((c, i) => [c, i]));
  const m = CHRS.map(() => CHRS.map(() => 0)), raw = CHRS.map(() => CHRS.map(() => 0));
  const byBand = CHRS.map(() => CHRS.map(() => ({})));
  for (const d of rows) {
    if (!active.has(d.band)) continue;
    const i = idx[d.a], j = idx[d.b];
    if (i === j && !showSame) continue;
    raw[i][j] += d.n; if (i !== j) raw[j][i] += d.n;
    byBand[i][j][d.band] = d; if (i !== j) byBand[j][i][d.band] = d;
  }
  for (let i = 0; i < 22; i++) for (let j = 0; j < 22; j++) m[i][j] = scaleMode === "sqrt" ? Math.sqrt(raw[i][j]) : raw[i][j];
  return { m, raw, byBand };
}

/* ---------- drawing (also used for the white-background export) ---------- */
function render(svg, P, interactive) {
  svg.selectAll("*").remove();
  const W = 820, H = 860, cx = W / 2, cy = 440, outer = 300, inner = 284;
  const { m, raw, byBand } = matrix();
  const total = d3.sum(raw.flat()) / 2 + d3.sum(raw.map((r, i) => r[i] / 2));      // each pair counted once
  svg.append("rect").attr("width", W).attr("height", H).attr("fill", P.bg);
  svg.append("text").attr("x", 24).attr("y", 34).attr("fill", P.ink).attr("font-size", 20).attr("font-weight", 600)
     .attr("font-family", "system-ui,Arial,sans-serif").text(CFG.title);
  svg.append("text").attr("x", 24).attr("y", 56).attr("fill", P.muted).attr("font-size", 13)
     .attr("font-family", "system-ui,Arial,sans-serif").text(CFG.cohort + " · " + CFG.threshold);
  if (CFG.note) svg.append("text").attr("x", W - 24).attr("y", 34).attr("text-anchor", "end").attr("fill", "#c2410c")
     .attr("font-size", 14).attr("font-weight", 700).attr("font-family", "system-ui,Arial,sans-serif").text(CFG.note);

  const g = svg.append("g").attr("transform", `translate(${cx},${cy})`);
  const chord = d3.chord().padAngle(0.025).sortSubgroups(d3.descending)(m);
  const arc = d3.arc().innerRadius(inner).outerRadius(outer);
  const ribbon = d3.ribbon().radius(inner - 2);

  const dim = d => focus !== null && d.source.index !== focus && d.target.index !== focus;

  const rib = g.append("g").selectAll("path").data(chord).join("path").attr("class", "rib")
    .attr("d", ribbon).attr("fill", d => COL(d.source.index)).attr("fill-opacity", d => dim(d) ? 0.05 : 0.55)
    .attr("stroke", d => d3.color(COL(d.source.index)).darker(0.6)).attr("stroke-opacity", d => dim(d) ? 0.05 : 0.5).attr("stroke-width", 0.4);

  const grp = g.append("g").selectAll("g").data(chord.groups).join("g");
  grp.append("path").attr("class", "arc").attr("d", arc).attr("fill", d => COL(d.index)).attr("stroke", P.bg).attr("stroke-width", 1)
     .attr("opacity", d => focus === null || focus === d.index ? 1 : 0.35).style("cursor", interactive ? "pointer" : null);
  grp.append("text").each(d => { d.angle = (d.startAngle + d.endAngle) / 2; })
     .attr("transform", d => `rotate(${d.angle * 180 / Math.PI - 90}) translate(${outer + 14}) ${d.angle > Math.PI ? "rotate(180)" : ""}`)
     .attr("text-anchor", d => d.angle > Math.PI ? "end" : null).attr("dy", "0.35em").attr("fill", P.ink)
     .attr("font-size", 13).attr("font-family", "system-ui,Arial,sans-serif").text(d => d.index + 1);

  svg.append("text").attr("x", cx).attr("y", cy - 4).attr("text-anchor", "middle").attr("fill", P.ink).attr("font-size", 22)
     .attr("font-weight", 600).attr("font-family", "system-ui,Arial,sans-serif").text(compact(total));
  svg.append("text").attr("x", cx).attr("y", cy + 18).attr("text-anchor", "middle").attr("fill", P.muted).attr("font-size", 12.5)
     .attr("font-family", "system-ui,Arial,sans-serif").text("edges shown");
  const bl = bandNames.filter(b => active.has(b));
  svg.append("text").attr("x", 24).attr("y", H - 22).attr("fill", P.muted).attr("font-size", 12)
     .attr("font-family", "system-ui,Arial,sans-serif")
     .text("Lift bands: " + (bl.length ? bl.map(b => b.startsWith(">=") ? "\u2265 " + b.slice(2) : b.replace("-", "\u2013")).join(", ") : "none") + (showSame ? "" : " · cross-chromosome only") +
           " · ribbon width ∝ " + (scaleMode === "sqrt" ? "√(edges)" : "edges") + " · chromosomes 1–22");

  if (interactive) {
    const tip = d3.select("#tip");
    const place = e => { const r = document.getElementById("chart").getBoundingClientRect();
      tip.style("left", Math.min(e.clientX - r.left + 14, r.width - 270) + "px").style("top", (e.clientY - r.top + 14) + "px"); };
    const bandTable = (i, j) => {
      const bb = byBand[i][j]; let h = "";
      bandNames.filter(b => active.has(b) && bb[b]).forEach(b => {
        h += `<div class="muted">${b.startsWith(">=") ? "≥ " + b.slice(2) : b.replace("-", "–")}: <b style="color:var(--ink)">${fmt(bb[b].n)}</b> edges, mean weight ${bb[b].w.toFixed(1)}</div>`; });
      return h || '<div class="muted">no edges in the selected bands</div>';
    };
    rib.on("mousemove", (e, d) => { const i = d.source.index, j = d.target.index;
        tip.style("display", "block").html(`<b>chr${i + 1} – chr${j + 1}</b>${i === j ? " (same chromosome)" : ""}<div><b>${fmt(raw[i][j])}</b> edges</div>${bandTable(i, j)}`); place(e); })
       .on("mouseleave", () => tip.style("display", "none"));
    grp.on("mousemove", (e, d) => { const i = d.index, t = d3.sum(raw[i]) - raw[i][i] / 2;
        tip.style("display", "block").html(`<b>chr${i + 1}</b><div><b>${fmt(t)}</b> edges touch this chromosome</div><div class="muted">${fmt(raw[i][i])} within, ${fmt(t - raw[i][i])} to other chromosomes</div>`); place(e); })
       .on("mouseleave", () => tip.style("display", "none"))
       .on("click", (e, d) => { focus = focus === d.index ? null : d.index; draw(); });
  }
  return { raw, total };
}

function panel(raw, total) {
  const same = d3.sum(raw.map((r, i) => r[i]));
  let h = `<h2>Selected edges</h2><table>
    <tr><td>Total</td><td>${fmt(total)}</td></tr>
    <tr><td>Same chromosome</td><td>${fmt(same)}</td></tr>
    <tr><td>Cross-chromosome</td><td>${fmt(total - same)}</td></tr>
    <tr><td class="muted">Cross share</td><td class="muted">${total ? ((total - same) / total * 100).toFixed(1) : "0"}%</td></tr></table>`;
  if (focus !== null) {
    const partners = raw[focus].map((n, j) => ({ j, n: j === focus ? raw[j][j] : raw[focus][j] })).sort((a, b) => b.n - a.n).slice(0, 6);
    h += `<h2>chr${focus + 1}: top partners</h2><table>` +
         partners.map(p => `<tr><td>${p.j === focus ? "within chr" + (focus + 1) : "chr" + (p.j + 1)}</td><td>${fmt(p.n)}</td></tr>`).join("") + "</table>";
  } else h += `<div class="muted">Click a chromosome to see its top partners.</div>`;
  document.getElementById("panel").innerHTML = h;
}

function draw() {
  document.getElementById("sub").textContent = CFG.cohort + " · " + CFG.threshold;
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  const out = render(d3.select("#svg"), dark ? DARK : LIGHT, true);
  panel(out.raw, out.total);
}

/* ---------- controls and exports ---------- */
document.getElementById("same").addEventListener("change", e => { showSame = e.target.checked; draw(); });
document.getElementById("scale").addEventListener("change", e => { scaleMode = e.target.value; draw(); });
document.getElementById("reset").addEventListener("click", () => { focus = null; active = new Set(bandNames); showSame = true;
  document.getElementById("same").checked = true; buildControls(); draw(); });

function exportSvgString() {
  const host = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  host.setAttribute("xmlns", "http://www.w3.org/2000/svg"); host.setAttribute("viewBox", "0 0 820 860");
  host.setAttribute("width", 820); host.setAttribute("height", 860);
  render(d3.select(host), LIGHT, false);
  return new XMLSerializer().serializeToString(host);
}
function save(name, blob) { const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
document.getElementById("dlsvg").addEventListener("click", () => save("haplograph_chord.svg", new Blob([exportSvgString()], { type: "image/svg+xml" })));
document.getElementById("dlpng").addEventListener("click", () => {
  const img = new Image(), url = URL.createObjectURL(new Blob([exportSvgString()], { type: "image/svg+xml" }));
  img.onload = () => { const c = document.createElement("canvas"); c.width = 820 * 3; c.height = 860 * 3; const x = c.getContext("2d");
    x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
    c.toBlob(b => save("haplograph_chord.png", b)); URL.revokeObjectURL(url); };
  img.src = url; });
document.getElementById("dlcsv").addEventListener("click", () => {
  const out = ["chrom_a,chrom_b,lift_band,n_edges,mean_weight"].concat(rows.filter(d => active.has(d.band) && (showSame || d.a !== d.b))
    .map(d => [d.a, d.b, d.band, d.n, d.w].join(",")));
  save("haplograph_chrpair_selected.csv", new Blob([out.join("\n") + "\n"], { type: "text/csv" })); });

/* ---------- start ---------- */
function fail(err) {
  const m = document.getElementById("msg"); m.style.display = "block";
  m.innerHTML = `Could not load <code>${CFG.data}</code> (${err.message}).<br>Choose the file here: <input type="file" id="pick" accept=".tsv,.txt,text/tab-separated-values">`;
  document.getElementById("pick").addEventListener("change", e => e.target.files[0].text().then(t => { m.style.display = "none"; try { load(t); } catch (x) { fail(x); } }));
}
const EMBEDDED_TSV =
